<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function greet(name , callback){
            document.writeln("Hi " + name);
            callback();
        }
        function goodbye(){
            document.write("Good bye!!");
        }
        greet("Dev" , goodbye);
    </script>
</body>
</html>
