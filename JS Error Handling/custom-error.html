<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function divide(num1,num2){
            if(num2 == 0){
                // throw statements allows to create custom error.
                throw new Error("infinity!");
            }
            return num1/num2;
        }
        try{
            console.log(divide(10,0));
        }
        catch(error){
            console.log(error);
        }
    </script>
</body>
</html>
