<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left">
        <img src="432 product-img/image1.png" id="product-img"/>
        <div class="btns">
          <button class="img-btn btn1"></button>
          <button class="img-btn btn2"></button>
          <button class="img-btn btn3"></button>
        </div>
      </div>
      <div class="right">
        <h1>Casual T-Shirt</h1>
        <h2>$15.00</h2>
        <h3 id="price">30% OFF</h3>
        <p>
          Wrangler is an American manufacturer of jeans and other clothing
          items,particularly workwear.
        </p>
        <div class="size">
          <h3>Size</h3>
          <button class="size-btn">S</button>
          <button class="size-btn">M</button>
          <button class="size-btn">L</button>
          <button class="size-btn">XL</button>
          <button class="size-btn">XXL</button>
        </div>
        <div class="colors">
          <h3>Color</h3>
          <button class="color-btn clr-btn1"></button>
          <button class="color-btn clr-btn2"></button>
          <button class="color-btn clr-btn3"></button>
          <button class="color-btn clr-btn4"></button>
        </div>
        <div class="quantity">
          <h3>Quantity</h3>
          <input type="number" id="quan-num" />
        </div>
        <button id="buy">Buy Now</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
